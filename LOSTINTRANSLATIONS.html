<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOST IN TRANSLATIONS</title>

<style>
  :root {
    --purple-deep: rgb(22, 8, 95);
    --purple-violet: rgb(109, 77, 204);
    --purple-lavender: rgb(131, 119, 183);
    --void: #05010f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: "Courier New", monospace;
    color: #d8cfff;
    overflow-x: hidden;
    background: var(--void);
  }

  /* === BASE LAYER: dark purple void === */
  body::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: -3;

    background:
      radial-gradient(circle at 25% 30%, rgba(109, 77, 204, 0.22), transparent 55%),
      radial-gradient(circle at 75% 70%, rgba(22, 8, 95, 0.85), transparent 60%),
      radial-gradient(circle at 50% 50%, rgba(131, 119, 183, 0.12), transparent 70%),
      linear-gradient(160deg, #05010f 0%, #0b0326 40%, #1a0740 70%, #05010f 100%);

    animation: breathe 12s ease-in-out infinite;
    filter: contrast(1.1) saturate(1.2);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.05); opacity: 1; }
  }

  /* === FOG LAYER: drifting mist === */
  body::after {
    content: "";
    position: fixed;
    inset: -50%;
    z-index: -2;
    pointer-events: none;

    background:
      radial-gradient(ellipse at 30% 40%, rgba(131, 119, 183, 0.15), transparent 45%),
      radial-gradient(ellipse at 70% 60%, rgba(109, 77, 204, 0.12), transparent 50%),
      radial-gradient(ellipse at 50% 20%, rgba(22, 8, 95, 0.4), transparent 60%);

    animation: drift 30s linear infinite;
    mix-blend-mode: screen;
  }

  @keyframes drift {
    0%   { transform: translate3d(-5%, -3%, 0) rotate(0deg); }
    50%  { transform: translate3d(5%, 3%, 0) rotate(180deg); }
    100% { transform: translate3d(-5%, -3%, 0) rotate(360deg); }
  }

  /* === VIGNETTE === */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(
      ellipse at center,
      transparent 40%,
      rgba(0, 0, 0, 0.75) 100%
    );
  }

  /* === GRAIN === */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grainShift 0.6s steps(3) infinite;
  }

  @keyframes grainShift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-3%, 2%); }
    50%  { transform: translate(2%, -3%); }
    75%  { transform: translate(-2%, -2%); }
    100% { transform: translate(0, 0); }
  }

  /* === CONTENT === */
  .content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .title {
    font-size: clamp(2rem, 8vw, 6rem);
    letter-spacing: 0.15em;
    color: #e8defc;
    text-transform: uppercase;
    text-shadow:
      0 0 8px rgba(131, 119, 183, 0.8),
      0 0 24px rgba(109, 77, 204, 0.6),
      0 0 60px rgba(22, 8, 95, 0.9);
    animation: flicker 5s infinite;
    position: relative;
    user-select: none;
  }

  /* === GLITCH === */
  .title::before,
  .title::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    text-shadow: none;
    pointer-events: none;
  }

  .title::before {
    color: #ff2a6d;
    left: 2px;
    text-shadow: -2px 0 #ff2a6d;
    animation: glitchTop 3s infinite steps(2, end);
    mix-blend-mode: screen;
    opacity: 0.7;
  }

  .title::after {
    color: #00e5ff;
    left: -2px;
    text-shadow: 2px 0 #00e5ff;
    animation: glitchBottom 2.7s infinite steps(2, end);
    mix-blend-mode: screen;
    opacity: 0.7;
  }

  @keyframes glitchTop {
    0%, 92%, 100% { transform: translate(0); opacity: 0; }
    93% { transform: translate(-3px, -2px); opacity: 0.8; }
    95% { transform: translate(3px, 1px); opacity: 0.6; }
    97% { transform: translate(-2px, 2px); opacity: 0.9; }
  }

  @keyframes glitchBottom {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    91% { transform: translate(3px, 2px); opacity: 0.8; }
    94% { transform: translate(-3px, -1px); opacity: 0.6; }
    96% { transform: translate(2px, -2px); opacity: 0.9; }
  }

  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      opacity: 1;
    }
    20%, 24%, 55% {
      opacity: 0.55;
    }
  }

  .subtitle {
    margin-top: 2rem;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    letter-spacing: 0.5em;
    color: rgba(131, 119, 183, 0.65);
    text-transform: uppercase;
    animation: whisper 6s ease-in-out infinite;
  }

  @keyframes whisper {
    0%, 100% { opacity: 0.4; letter-spacing: 0.5em; }
    50%      { opacity: 0.9; letter-spacing: 0.55em; }
  }

  /* === SCANLINE OVERLAY (optional, remove if too much) === */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.25) 3px,
      rgba(0, 0, 0, 0) 4px
    );
    opacity: 0.35;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>

  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>

  <main class="content">
    <h1 class="title" data-text="LOST IN TRANSLATIONS">
      Ḻ̶̛̦̼̐̋̐̈Ȏ̸͔͙̮̈̂̄̆̒́S̵͔̀̓͋̽͝T̷̢̠̗̯̗̣̉̽̒̕ I̶̘͊̄̉N̵̟͕̤̄͑ T̷̳͓̦̓̃͛̾R̷̛̝̟̭̻͖̩͐̕A̴̢̤̰̝̰̻̳͌͑͝N̸̫̫̲̞̘̝̈͋͗Ṣ̶̘̳͂̈́L̸̬͔͕͍͙͛̋À̶̱̯̯́̈́T̸̹̱̖̔́̀̒͛͒͝Ỉ̶̘͚̦̞̥̱͇͋Ǒ̷̟͓̮̖̀̆̈̽N̵̛͇͚̼͊͂̇̒̄S̵͇͘͝
    </h1>
    <p class="subtitle">something got lost along the way</p>
  </main>

</body>
</html>
