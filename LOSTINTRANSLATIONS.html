<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOST IN TRANSLATIONS</title>

<style>
  :root {
    --deep-purple: rgb(22, 8, 95);
    --violet: rgb(109, 77, 204);
    --lavender: rgb(131, 119, 183);
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    margin: 0;
    font-family: "Courier New", monospace;
    color: #e8defc;
  }

  body {
    background-color: var(--deep-purple);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(131, 119, 183, 0.35), transparent 45%),
      radial-gradient(circle at 80% 15%, rgba(109, 77, 204, 0.45), transparent 50%),
      radial-gradient(circle at 50% 85%, rgba(22, 8, 95, 0.85), transparent 55%),
      linear-gradient(
        135deg,
        var(--deep-purple) 0%,
        var(--violet) 50%,
        var(--lavender) 100%
      );
    background-attachment: fixed;
  }

  .content {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .title {
    font-size: clamp(2rem, 8vw, 6rem);
    letter-spacing: 0.15em;
    color: #e8defc;
    text-transform: uppercase;
    text-shadow:
      0 0 8px rgba(131, 119, 183, 0.8),
      0 0 24px rgba(109, 77, 204, 0.6),
      0 0 60px rgba(22, 8, 95, 0.9);
    position: relative;
    user-select: none;
  }

  .title::before,
  .title::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    text-shadow: none;
    pointer-events: none;
    opacity: 0;
  }

  .title::before {
    color: #7a0000;
    left: 2px;
    text-shadow: -2px 0 #7a0000;
    animation: glitchTop 3s infinite steps(2, end);
    mix-blend-mode: screen;
  }

  .title::after {
    color: #b8a8d0;
    left: -2px;
    text-shadow: 2px 0 #b8a8d0;
    animation: glitchBottom 2.7s infinite steps(2, end);
    mix-blend-mode: screen;
  }

  @keyframes glitchTop {
    0%, 92%, 100% { transform: translate(0); opacity: 0; }
    93% { transform: translate(-3px, -2px); opacity: 0.7; }
    95% { transform: translate(3px, 1px);  opacity: 0.5; }
    97% { transform: translate(-2px, 2px); opacity: 0.8; }
  }

  @keyframes glitchBottom {
    0%, 90%, 100% { transform: translate(0); opacity: 0; }
    91% { transform: translate(3px, 2px);  opacity: 0.7; }
    94% { transform: translate(-3px, -1px); opacity: 0.5; }
    96% { transform: translate(2px, -2px); opacity: 0.8; }
  }
</style>
</head>
<body>

  <main class="content">
    <h1 class="title" data-text="L̴̘̐̿O̶̢̬͘Ś̶̞̕T̸̰̄ ̵̳̚I̷̻͓͝N̶͖̺͐ ̶̡̛͈̂T̸̨̜̐̈́R̸̲̱̒̀A̴̝͘Ñ̴̮̾S̴̺̏L̷̝̀̍Å̶̺T̷̮̻̎͝I̷͈̥̓Ô̵̝̯N̸̜̮̏S̴̨̢̿͠">L̴̘̐̿O̶̢̬͘Ś̶̞̕T̸̰̄ ̵̳̚I̷̻͓͝N̶͖̺͐ ̶̡̛͈̂T̸̨̜̐̈́R̸̲̱̒̀A̴̝͘Ñ̴̮̾S̴̺̏L̷̝̀̍Å̶̺T̷̮̻̎͝I̷͈̥̓Ô̵̝̯N̸̜̮̏S̴̨̢̿͠</h1>
  </main>

</body>
</html>
